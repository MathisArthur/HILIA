<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page introuvable - HILIA</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#064647">
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --teal:#064647; --teal-soft:#0E5C5D; --amber:#FEB31E; --cream:#F8F3E8; --paper:#FFFDF8; --ink:#183A3A; --muted:#5D726F; --line:#E7DFCF; }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--cream);color:var(--ink);font-family:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;text-align:center;}
  .card{background:var(--paper);border:1.5px solid var(--line);border-radius:20px;padding:34px 28px;max-width:620px;width:100%;box-shadow:0 8px 28px rgba(6,70,71,.07);}
  .brand{font-family:"Archivo",system-ui,sans-serif;font-weight:900;letter-spacing:.06em;color:var(--teal);font-size:1.05rem;margin:0 0 22px;}
  .code{font-family:"Archivo",system-ui,sans-serif;font-weight:900;font-size:3.6rem;line-height:1;color:var(--amber);margin:0;}
  h1{font-family:"Archivo",system-ui,sans-serif;font-weight:800;font-size:1.5rem;margin:12px 0 10px;color:var(--teal);}
  p{line-height:1.6;margin:0 0 22px;color:var(--muted);}
  .actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
  a.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;border-radius:999px;padding:12px 20px;border:1.5px solid var(--teal);}
  a.primary{background:var(--teal);color:#fff;}
  a.secondary{background:transparent;color:var(--teal);}
  a.btn:focus-visible{outline:3px solid var(--amber);outline-offset:2px;}
  .links{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);font-size:.9rem;}
  .links a{color:var(--teal-soft);}
  .links ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:14px;justify-content:center;}
  a{color:var(--teal-soft);}
  a:focus-visible{outline:3px solid var(--amber);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
  <main class="card">
    <p class="brand">HILIA</p>
    <p class="code" aria-hidden="true">404</p>
    <h1>Cette page n’existe pas</h1>
    <p>L’adresse demandée est erronée, ou la page a été déplacée. Les lieux référencés restent accessibles depuis l’accueil.</p>
    <div class="actions">
      <a class="btn primary" href="/">Revenir à l’accueil</a>
      <a class="btn secondary" href="/contact">Signaler une page manquante</a>
    </div>
    <nav class="links" aria-label="Pages utiles">
      <ul>
        <li><a href="/a-propos">À propos</a></li>
        <li><a href="/faq">Questions fréquentes</a></li>
        <li><a href="/prestataires">Référencer mon activité</a></li>
        <li><a href="/accessibilite">Accessibilité</a></li>
        <li><a href="/contact">Contact</a></li>
      </ul>
    </nav>
  </main>
</body>
</html>
